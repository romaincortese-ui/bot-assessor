[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bot-assessor"
version = "0.1.0"
description = "Central daily assessment and safe-overlay service for trading bots"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "requests>=2.31.0",
  "redis>=5.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
bot-assessor = "bot_assessor.cli:main"

[tool.setuptools.packages.find]
include = ["bot_assessor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"